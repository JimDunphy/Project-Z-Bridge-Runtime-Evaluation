# Example nginx reverse proxy for Project Z-Bridge runtime evaluation.
#
# Replace:
# - bridge.example.com with BRIDGE_PUBLIC_BASE_URL host
# - renderer.example.com with BRIDGE_EMAIL_IFRAME_RENDERER_ORIGIN host
# - certificate paths with local SAN certificate paths
#
# Use one TLS certificate whose SAN list covers both bridge.example.com and
# renderer.example.com.

upstream project_z_bridge_runtime {
    # Host nginx -> Docker-published host port. Update if BRIDGE_PORT changes.
    server 127.0.0.1:7777;

    # If nginx runs in Docker on a shared Docker network, use this instead:
    # server project-z-bridge-runtime-eval:7777;
}

server {
    listen 80;
    server_name bridge.example.com renderer.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bridge.example.com;

    ssl_certificate /etc/letsencrypt/live/project-z-bridge-runtime/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project-z-bridge-runtime/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Convenience: landing on the hostname opens the web client.
    location = / {
        return 302 /zimbra/;
    }

    location = /healthz {
        proxy_pass http://project_z_bridge_runtime;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Project Z-Bridge web client, SOAP/REST routes, uploads, CSP reports,
    # image proxy, and same-origin renderer registration.
    location ~ ^/(zimbra|service|home|h|public|img|brand)(/|$) {
        proxy_pass http://project_z_bridge_runtime;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;

        # The main app can be framed by itself for legacy ZWC workflows.
        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name renderer.example.com;

    ssl_certificate /etc/letsencrypt/live/project-z-bridge-runtime/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project-z-bridge-runtime/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Renderer views/resources are framed by the main bridge origin.
    # Do not add X-Frame-Options here; SAMEORIGIN would block the intended
    # cross-origin iframe from bridge.example.com.
    location ~ ^/service/email-renderer/(view|resource)/ {
        proxy_pass http://project_z_bridge_runtime;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;

        proxy_hide_header X-Frame-Options;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
